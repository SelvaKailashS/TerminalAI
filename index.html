<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="K2BMJtiLgblN4cjkFbpuhCYSV8A4xfvrGHMD86PuCaE" />
    <title>ZEUS — Ghost of Olympus</title>
    <meta name="description" content="Zeus. LLaMA-3.3-70B on Groq. Speak, and Olympus answers in fire." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Cinzel+Decorative:wght@700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-BTrF5J0i.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BiWM6HT5.css">
  </head>
  <body>
    <a class="skip-link" href="#composer-input">Skip to message</a>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="ash-veil" aria-hidden="true"></div>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-name">Zeus</p>
            <p class="brand-meta">Ghost of Olympus · Groq</p>
          </div>
        </div>
        <div class="top-actions">
          <p class="status" id="status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="status-text">Olympus burns</span>
          </p>
          <p class="clock" id="clock">--:--:--</p>
          <button class="ghost" type="button" id="btn-sidebar" aria-expanded="false" aria-controls="sidebar">
            Sagas
          </button>
          <button class="ghost" type="button" id="btn-tts" title="Toggle Voice Output (Speech)">🔊</button>
          <button class="ghost" type="button" id="btn-new">New war</button>
        </div>
      </header>

      <div class="scrim" id="scrim" hidden></div>

      <aside class="sidebar" id="sidebar" aria-label="Chat history">
        <p class="side-label">Blood oaths</p>
        <div class="history" id="history">
          <p class="empty-hist">No battles yet. Speak, and begin.</p>
        </div>
        <div class="stat">
          <p class="stat-label">Kills</p>
          <p class="stat-count" id="total-chats">0</p>
        </div>
      </aside>

      <main class="stage" id="stage">
        <section class="welcome" id="welcome">
          <p class="kicker">From the ashes of Olympus</p>
          <h1><span>Boy.</span><em>Speak.</em></h1>
          <p class="lede">I am Zeus. The mountain still smokes. Ask, and I will answer in fire.</p>
          <div class="prompts" id="prompts">
            <button type="button" data-prompt="Today's hot news">
              <span>I</span>
              <strong>The world's blood</strong>
              <small>Today's hot news</small>
            </button>
            <button type="button" data-prompt="What can you do?">
              <span>II</span>
              <strong>My weapons</strong>
              <small>What Zeus can do</small>
            </button>
            <button type="button" data-prompt="Explain black holes">
              <span>III</span>
              <strong>The void</strong>
              <small>Explain black holes</small>
            </button>
            <button type="button" data-prompt="How many AIs exist?">
              <span>IV</span>
              <strong>False gods</strong>
              <small>How many AIs exist?</small>
            </button>
          </div>
        </section>
        <div class="thread" id="thread" hidden role="log" aria-live="polite" aria-relevant="additions"></div>
      </main>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-box">
          <div class="file-preview" id="file-preview" hidden>
            <span class="file-badge">
              <span class="file-icon">📄</span>
              <span class="file-name" id="file-name">filename.txt</span>
              <button type="button" class="file-remove" id="btn-file-remove" title="Remove attached file">&times;</button>
            </span>
          </div>

          <label class="composer-label" for="composer-input">Command</label>
          <textarea
            id="composer-input"
            name="message"
            rows="1"
            placeholder="Ask Zeus anything..."
            maxlength="4000"
          ></textarea>

          <div class="composer-toolbar">
            <div class="left-tools">
              <input type="file" id="file-input" hidden accept=".txt,.pdf,.csv,.json,.md,.png,.jpg,.jpeg,.py,.js,.html,.css" />
              <button class="tool-btn" type="button" id="btn-upload" title="Upload File">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
              </button>
              <button class="tool-btn" type="button" id="btn-mic" title="Voice Input (Mic)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
              </button>
            </div>
            <button class="send" type="submit" id="btn-send">
              <span class="send-label">Strike</span>
              <span class="send-wait" hidden>Forging</span>
            </button>
          </div>
        </div>
        <p class="form-error" id="form-error" role="alert"></p>
      </form>
    </div>

  </body>
</html>
